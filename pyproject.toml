[project]
name = "neckflix"
version = "1.0.0"
description = "Preprocessing companion tool for the Neckflix dataset: temporal alignment, optional resize, zarr output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=15.0.0",
    "h5py>=3.12",
    "hdf5plugin>=5.1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "tqdm>=4.67.1",
    "zarr>=3.3,<4",
]

[project.scripts]
neckflix-preprocess = "neckflix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neckflix"]

[tool.uv]
link-mode = "copy"
